<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Social Card Preview - Justin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #00f5a0;
    --white: #eef4f8;
    --muted: #9aa9bc;
    --bg: #050b11;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    background:
      radial-gradient(ellipse 70% 55% at 50% 42%, rgba(0,245,160,.09), transparent 65%),
      var(--bg);
    font-family: 'Manrope', sans-serif;
  }

  /* ---- the card (plain-CSS interpretation of the social-card component) ---- */
  .social-card {
    position: relative;
    width: min(340px, 100%);
    padding: 34px 30px 30px;
    border: 1px solid rgba(0,245,160,.22);
    border-radius: 22px;
    background: linear-gradient(155deg, #13242c, #071018 72%);
    box-shadow: 0 16px 42px rgba(0,0,0,.32), inset 0 1px rgba(255,255,255,.045);
    text-align: center;
    cursor: pointer;
    overflow: hidden;
    transition: border-color .35s, box-shadow .35s, transform .35s;
  }
  .social-card::before {
    content: "";
    position: absolute;
    inset: -40% -20% auto;
    height: 70%;
    background: radial-gradient(ellipse at 50% 0%, rgba(0,245,160,.14), transparent 70%);
    pointer-events: none;
  }
  .social-card:hover, .social-card.open, .social-card:focus-visible {
    border-color: rgba(0,245,160,.55);
    box-shadow: 0 0 0 1px rgba(0,245,160,.14), 0 0 34px rgba(0,245,160,.12), 0 18px 48px rgba(0,0,0,.4);
    transform: translateY(-3px);
    outline: none;
  }
  .social-card .card-kicker {
    color: var(--green);
    font: 10px 'JetBrains Mono', monospace;
    letter-spacing: 2px;
    display: block;
    margin-bottom: 10px;
  }
  .social-card .card-title {
    color: var(--white);
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -.5px;
  }
  .social-card .card-sub {
    color: var(--muted);
    font-size: 12.5px;
    margin-top: 8px;
    line-height: 1.6;
  }
  .social-card .card-hint {
    color: rgba(154,169,188,.55);
    font: 9px 'JetBrains Mono', monospace;
    letter-spacing: 1.2px;
    margin-top: 18px;
    transition: opacity .3s;
  }
  .social-card:hover .card-hint, .social-card.open .card-hint, .social-card:focus-visible .card-hint { opacity: 0; }

  /* ---- icon boxes: collapsed, revealed on hover/tap with staggered delays ---- */
  .social-boxes {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin-top: 0;
    max-height: 0;
    overflow: hidden;
    transition: max-height .45s cubic-bezier(.34,1.2,.64,1), margin-top .35s ease;
  }
  .social-card:hover .social-boxes, .social-card.open .social-boxes, .social-card:focus-visible .social-boxes {
    max-height: 70px;
    margin-top: 20px;
  }
  .social-box {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 52px;
    height: 52px;
    border-radius: 14px;
    border: 1px solid rgba(0,245,160,.3);
    background: rgba(0,245,160,.06);
    opacity: 0;
    transform: translateY(18px) scale(.85);
    transition: opacity .35s ease, transform .35s cubic-bezier(.34,1.56,.64,1),
                background .25s, border-color .25s, box-shadow .25s;
  }
  .social-card:hover .social-box, .social-card.open .social-box, .social-card:focus-visible .social-box {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
  /* staggered reveal, like the component's delay prop; reverse stagger on the way out */
  .social-card:hover .social-box:nth-child(1), .social-card.open .social-box:nth-child(1), .social-card:focus-visible .social-box:nth-child(1) { transition-delay: .08s; }
  .social-card:hover .social-box:nth-child(2), .social-card.open .social-box:nth-child(2), .social-card:focus-visible .social-box:nth-child(2) { transition-delay: .2s; }
  .social-card:hover .social-box:nth-child(3), .social-card.open .social-box:nth-child(3), .social-card:focus-visible .social-box:nth-child(3) { transition-delay: .32s; }
  .social-box:nth-child(1) { transition-delay: .14s; }
  .social-box:nth-child(2) { transition-delay: .07s; }
  .social-box:nth-child(3) { transition-delay: 0s; }
  .social-box svg { width: 22px; height: 22px; fill: var(--green); }
  .social-box:hover {
    background: rgba(0,245,160,.16);
    border-color: var(--green);
    box-shadow: 0 0 18px rgba(0,245,160,.25);
  }
  .social-box-label {
    display: block;
    margin-top: 0;
    max-height: 0;
    overflow: hidden;
    color: rgba(154,169,188,.6);
    font: 8.5px 'JetBrains Mono', monospace;
    letter-spacing: 1px;
    opacity: 0;
    transition: opacity .3s .25s, max-height .4s ease, margin-top .35s ease;
  }
  .social-card:hover .social-box-label, .social-card.open .social-box-label, .social-card:focus-visible .social-box-label {
    opacity: 1;
    max-height: 20px;
    margin-top: 14px;
  }

  .page-note {
    position: fixed;
    bottom: 14px; left: 0; right: 0;
    text-align: center;
    color: rgba(154,169,188,.45);
    font: 9px 'JetBrains Mono', monospace;
    letter-spacing: 1px;
  }
</style>
</head>
<body>

  <div class="social-card" id="socialCard" tabindex="0" role="group" aria-label="Justin's social links">
    <span class="card-kicker">// OPEN CHANNEL</span>

    </div>
    <span class="social-box-label">GITHUB · LINKEDIN · EMAIL</span>
  </div>

  <div class="page-note">PREVIEW ONLY - NOT LINKED FROM THE MAIN PAGE</div>

<script>
  // Touch support: tapping the card toggles the reveal (hover does not exist on touch)
  (function () {
    var card = document.getElementById('socialCard');
    card.addEventListener('click', function (e) {
      if (e.target.closest('a')) return; // let link taps through
      card.classList.toggle('open');
    });
    card.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); card.classList.toggle('open'); }
    });
  })();
</script>
</body>
</html>
